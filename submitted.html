
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Match submitted</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 40px; }
    .card { max-width: 640px; padding: 24px; border: 1px solid #ddd; border-radius: 12px; }
    .muted { color: #666; }
    a.button { display:inline-block; margin-top:16px; padding:10px 14px; border:1px solid #222; border-radius:10px; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Match submitted</h1>
    <p id="msg" class="muted">Processing…</p>
    <a class="button" id="backLink" href="#">Submit another match</a>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const matchId = params.get("matchId");

    document.getElementById("msg").textContent =
      matchId ? `Your match was recorded. Match ID: ${matchId}` : "Your match was recorded.";

    // Back link to your form
    const base = location.pathname.includes("/Slaps-Online/") ? "/Slaps-Online" : "";
    document.getElementById("backLink").href = `${base}/gameform.html`;
  </script>
</body>
</html>
