<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Player Stats</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page container">
    <div class="stack">
      <p><a href="ratingtable.html">← Back to ratings</a></p>

      <div class="card">
        <div class="card-head">
          <h1 id="playerTitle">Player</h1>

          <label class="toggle">
            Include friendlies (non-rated)
            <input type="checkbox" id="includeFriendlies" />
          </label>
        </div>

        <div id="loadingIndicator" class="loading hidden">
          <div class="spinner"></div>
          <span>Loading player statistics...</span>
        </div>

        <div id="playerSummary"></div>
        <div id="playerExtras"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h3>Elo progression (rated)</h3>
        </div>
        <div class="chart-wrap">
          <canvas id="eloChart"></canvas>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h3>Matches</h3>
        </div>
        <div id="playerMatches"></div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
