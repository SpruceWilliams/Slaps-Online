<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Slaps Online: Match Submission Form</title>
        <link rel="stylesheet" href="styles.css">
        <script src="js/config.js"></script>
    </head>

    <body>

        <header class="site-header">
            <div class="header-inner">
                <a href="index.html"><img src="isfpink.svg" alt="ISF Logo" class="site-logo"></a>
                <span class="site-title">Submit a New Match to the Official Slaps Database</span>
            </div>
        </header>
        
        <main>
            <h2>Fill out the form below to submit a new match.</h2>
            <form id="matchform" method="post">
                <fieldset><legend>Player Information</legend>
                    <div class="form-group">
                            <!--Input for Game Name-->
                            <label for="date">Date of Match: <input required type="date" id="date" name="date"> </label>
                            

                            <!--Input for Player 1 Full Name-->
                            <label for="player1fullname">
                            Player 1 Full Name:
                            <input required type="text" id="player1fullname" name="player1" list="playersList" autocomplete="off">
                            </label>

                            <!--Input for Player 2 Full Name-->
                            <label for="player2fullname">
                            Player 2 Full Name:
                            <input required type="text" id="player2fullname" name="player2" list="playersList" autocomplete="off">
                            </label>
                    </div>
                </fieldset>

                <fieldset><legend>Match Results</legend>
                    <div class="form-group">                      
                            <!--Input for Winner Name-->
                            <select name="winnername" required>
                            <option value="">Select winner</option>
                            <option value="PLAYER_1_NAME">Player 1</option>
                            <option value="PLAYER_2_NAME">Player 2</option>
                            </select>

                            <!--Input for Player 1 Games-->
                            <label for="player1games">Player 1 Rounds Won:</label>
                            <input required type="number" id="player1games" name="player1games">

                            <!--Input for Player 2 Games-->
                            <label for="player2games">Player 2 Rounds Won:</label>
                            <input required type="number" id="player2games" name="player2games">

                            <!--Input for Player 1 Slaps Won-->
                            <label for="player1slaps">Player 1 Slaps Won:</label>
                            <input required type="number" id="player1slaps" name="player1slaps">

                            <!--Input for Player 2 Slaps Won-->
                            <label for="player2slaps">Player 2 Slaps Won:</label>
                            <input required type="number" id="player2slaps" name="player2slaps">

                            <!--Input for Player 1 Yellow Cards-->
                            <label for="player1yellow">Player 1 Yellow Cards:</label>
                            <input required type="number" id="player1yellow" name="player1yellow">

                            <!--Input for Player 2 Yellow Cards-->
                            <label for="player2yellow">Player 2 Yellow Cards:</label>
                            <input required type="number" id="player2yellow" name="player2yellow">

                            <!--Input for Player 1 Red Cards-->
                            <label for="player1red">Player 1 Red Cards:</label> 
                            <input required type="number" id="player1red" name="player1red">

                            <!--Input for Player 2 Red Cards-->
                            <label for="player2red">Player 2 Red Cards:</label>
                            <input required type="number" id="player2red" name="player2red">
                    </div>
                </fieldset>
                
                <fieldset><legend>Match Details</legend>
                     <div class="form-group">

                            <!--Input for Referee Name-->
                            <label for="refname">Referee Name (Input "NA" for friendly matches):</label>
                            <input required type="text" id="refname" name="refname">

                            <!--Input for Match Type (e.g., 1v1, 2v2)-->
                            <label for="matchtype">Match Type:</label>
                            <select id="matchtype" name="matchtype" required>
                                <option value="friendly">Friendly (Unrated)</option>
                                <option value="headtohead">Head-to-Head (Rated)</option>
                                <option value="tournament">Tournament Match (Rated)</option>
                            </select>

                            <!--Input for Competition Name-->
                            <label for="competitionname">Competition Name:</label>
                            <input required type="text" id="competitionname" name="competitionname" placeholder="E.g., Tennents 2025 Slaps World Championship">
                    </div>
                </fieldset>
                
                <!-- Hidden idempotency key (an operation can be performed multiple times without changing the result) -->
                <input type="hidden" name="request_id" id="request_id" />

                <button type="submit" id="submitBtn">Submit Match</button>
            </form>

            <datalist id="playersList"></datalist>

            <script>
                document.addEventListener("DOMContentLoaded", () => {
                    // --- Guard: config.js must be loaded ---
                    if (!window.API || !window.API.BASE) {
                    alert("API config not loaded (js/config.js). Check script path.");
                    return;
                    }

                    // --- Elements ---
                    const formEl = document.getElementById("matchform");
                    const btn = document.getElementById("submitBtn");
                    const requestIdInput = document.getElementById("request_id");

                    const p1Input = document.getElementById("player1fullname");
                    const p2Input = document.getElementById("player2fullname");
                    const winnerSelect = document.querySelector("select[name='winnername']");
                    const datalistEl = document.getElementById("playersList");

                    // --- Set form action from config.js ---
                    formEl.action = window.API.BASE;

                    // --- Winner dropdown updates ---
                    function updateWinnerOptions() {
                    winnerSelect.innerHTML = `
                        <option value="">Select winner</option>
                        <option value="${p1Input.value}">${p1Input.value || "Player 1"}</option>
                        <option value="${p2Input.value}">${p2Input.value || "Player 2"}</option>
                    `;
                    }
                    p1Input.addEventListener("input", updateWinnerOptions);
                    p2Input.addEventListener("input", updateWinnerOptions);
                    p1Input.addEventListener("change", updateWinnerOptions);
                    p2Input.addEventListener("change", updateWinnerOptions);

                    // --- JSONP callback for players list ---
                    window.handlePlayersList = function(names) {
                    datalistEl.innerHTML = "";
                    (names || []).forEach(name => {
                        const opt = document.createElement("option");
                        opt.value = name;
                        datalistEl.appendChild(opt);
                    });
                    };

                    // --- Load players via JSONP ---
                    const playersScript = document.createElement("script");
                    playersScript.src = `${window.API.BASE}?action=players&callback=handlePlayersList`;
                    playersScript.onerror = () => {
                    console.error("Failed to load players list JSONP.");
                    };
                    document.head.appendChild(playersScript);

                    // --- One-shot submit + redirect ---
                    let submitting = false;

                    formEl.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    if (submitting) return;

                    submitting = true;
                    btn.disabled = true;
                    const oldText = btn.textContent;
                    btn.textContent = "Submitting...";

                    // Set idempotency token
                    requestIdInput.value =
                        (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);

                    try {
                        const resp = await fetch(formEl.action, {
                        method: "POST",
                        body: new FormData(formEl),
                        });

                        // Helpful debugging if Apps Script returns HTML instead of JSON
                        const text = await resp.text();
                        let result;
                        try {
                        result = JSON.parse(text);
                        } catch {
                        throw new Error("Server did not return JSON. Response was: " + text.slice(0, 120));
                        }

                        if (!result.success) throw new Error(result.error || "Unknown error");

                        const base = location.pathname.includes("/Slaps-Online/") ? "/Slaps-Online" : "";
                        window.location.href = `${base}/submitted.html?matchId=${encodeURIComponent(result.matchId)}`;

                    } catch (err) {
                        alert("Submission failed: " + err.message);
                        submitting = false;
                        btn.disabled = false;
                        btn.textContent = oldText;
                    }
                    });
                });
            </script>

    </script>

    </body>
