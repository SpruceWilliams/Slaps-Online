<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Slaps Online: Match Submission Form</title>
        <link rel="stylesheet" href="styles.css">
        <script src="js/config.js"></script>
    </head>

    <body>

        <header class="site-header">
            <div class="header-inner">
                <a href="index.html"><img src="isfpink.svg" alt="ISF Logo" class="site-logo"></a>
                <span class="site-title">Submit a New Match to the Official Slaps Database</span>
            </div>
        </header>
        
        <main>
            <h2>Fill out the form below to submit a new match.</h2>
            <form id="matchform" method="post">
                <fieldset><legend>Player Information</legend>
                    <div class="form-group">
                            <!--Input for Game Name-->
                            <label for="date">Date of Match: <input required type="date" id="date" name="date"> </label>
                            
                            <!--Input for Player 1 Name-->
                            <label for="player1fullname">
                            Player 1 Full Name:
                            <input required type="text" id="player1fullname" name="player1" list="playersList">
                            <small id="p1Hint" class="hint"></small>
                            </label>

                            <!--Input for Player 2 Name-->
                            <label for="player2fullname">
                            Player 2 Full Name:
                            <input required type="text" id="player2fullname" name="player2" list="playersList">
                            <small id="p2Hint" class="hint"></small>
                            </label>

                    </div>
                </fieldset>

                <fieldset><legend>Match Results</legend>
                    <div class="form-group">                      
                            <!--Input for Winner Name-->
                            <select name="winnername" required>
                            <option value="">Select winner</option>
                            <option value="PLAYER_1_NAME">Player 1</option>
                            <option value="PLAYER_2_NAME">Player 2</option>
                            </select>

                            <!--Input for Player 1 Games-->
                            <label for="player1games">Player 1 Rounds Won:</label>
                            <input required type="number" id="player1games" name="player1games">

                            <!--Input for Player 2 Games-->
                            <label for="player2games">Player 2 Rounds Won:</label>
                            <input required type="number" id="player2games" name="player2games">

                            <!--Input for Player 1 Slaps Won-->
                            <label for="player1slaps">Player 1 Slaps Won:</label>
                            <input required type="number" id="player1slaps" name="player1slaps">

                            <!--Input for Player 2 Slaps Won-->
                            <label for="player2slaps">Player 2 Slaps Won:</label>
                            <input required type="number" id="player2slaps" name="player2slaps">

                            <!--Input for Player 1 Yellow Cards-->
                            <label for="player1yellow">Player 1 Yellow Cards:</label>
                            <input required type="number" id="player1yellow" name="player1yellow">

                            <!--Input for Player 2 Yellow Cards-->
                            <label for="player2yellow">Player 2 Yellow Cards:</label>
                            <input required type="number" id="player2yellow" name="player2yellow">

                            <!--Input for Player 1 Red Cards-->
                            <label for="player1red">Player 1 Red Cards:</label> 
                            <input required type="number" id="player1red" name="player1red">

                            <!--Input for Player 2 Red Cards-->
                            <label for="player2red">Player 2 Red Cards:</label>
                            <input required type="number" id="player2red" name="player2red">
                    </div>
                </fieldset>
                
                <fieldset><legend>Match Details</legend>
                     <div class="form-group">

                            <!--Input for Referee Name-->
                            <label for="refname">Referee Name (Input "NA" for friendly matches):</label>
                            <input required type="text" id="refname" name="refname">

                            <!--Input for Match Type (e.g., 1v1, 2v2)-->
                            <label for="matchtype">Match Type:</label>
                            <select id="matchtype" name="matchtype" required>
                                <option value="friendly">Friendly (Unrated)</option>
                                <option value="headtohead">Head-to-Head (Rated)</option>
                                <option value="tournament">Tournament Match (Rated)</option>
                            </select>

                            <!--Input for Competition Name-->
                            <label for="competitionname">Competition Name:</label>
                            <input required type="text" id="competitionname" name="competitionname" placeholder="E.g., Tennents 2025 Slaps World Championship">
                    </div>
                </fieldset>
                
                <!-- Hidden idempotency key (an operation can be performed multiple times without changing the result) -->
                <input type="hidden" name="request_id" id="request_id" />

                <button type="submit" id="submitBtn">Submit Match</button>
            </form>

            <!-- Player datalist -->
            <datalist id="playersList"></datalist>

            <script>
            // Global cache used for validation + similarity checks
            window.playersCache = [];

            // Single JSONP callback (GLOBAL)
            window.handlePlayersList = function (names) {
                window.playersCache = Array.isArray(names) ? names.filter(Boolean) : [];

                const dl = document.getElementById("playersList");
                if (dl) {
                dl.innerHTML = "";
                window.playersCache.forEach((n) => {
                    const opt = document.createElement("option");
                    opt.value = n;
                    dl.appendChild(opt);
                });
                }

                console.log("Players loaded:", window.playersCache.length);
            };

            // Load players via JSONP
            (function loadPlayers() {
                const base = window.API && window.API.BASE;
                if (!base) {
                console.error("window.API.BASE not found. Is config.js loaded?");
                return;
                }

                // cache-bust to avoid stale responses
                const script = document.createElement("script");
                script.src = `${base}?action=players&callback=handlePlayersList&_=${Date.now()}`;
                script.onerror = () => console.error("Players JSONP failed to load");
                document.head.appendChild(script);
            })();
            </script>

            <script>
            document.addEventListener("DOMContentLoaded", () => {
                // --- Guard: config.js must be loaded ---
                if (!window.API || !window.API.BASE) {
                alert("API config not loaded (js/config.js). Check script path.");
                return;
                }

                // --- Elements ---
                const formEl = document.getElementById("matchform");
                const btn = document.getElementById("submitBtn");
                const requestIdInput = document.getElementById("request_id");

                const p1Input = document.getElementById("player1fullname");
                const p2Input = document.getElementById("player2fullname");
                const winnerSelect = document.querySelector("select[name='winnername']");

                // Optional hint elements (safe if missing)
                const p1Hint = document.getElementById("p1Hint");
                const p2Hint = document.getElementById("p2Hint");

                // --- Set form action from config.js ---
                formEl.action = window.API.BASE;

                // --- Winner dropdown updates ---
                function updateWinnerOptions() {
                winnerSelect.innerHTML = `
                    <option value="">Select winner</option>
                    <option value="${p1Input.value}">${p1Input.value || "Player 1"}</option>
                    <option value="${p2Input.value}">${p2Input.value || "Player 2"}</option>
                `;
                }
                p1Input.addEventListener("input", updateWinnerOptions);
                p2Input.addEventListener("input", updateWinnerOptions);
                p1Input.addEventListener("change", updateWinnerOptions);
                p2Input.addEventListener("change", updateWinnerOptions);

                // --- Name matching helpers ---
                const NICKNAMES = new Map([
                    ["will", "william"],
                    ["joe", "joseph"],
                    ["dan", "daniel"],
                    ["jonny", "jonathan"]
                ]);

                function tokenizeName(s) {
                    return normalizeName(s)
                        .split(" ")
                        .filter(Boolean);
                }

                function expandNick(token) {
                    return NICKNAMES.get(token) || token;
                }

                function tokenSimilarity(aTok, bTok) {
                // Exact/prefix match gets big boost
                    if (!aTok || !bTok) return 0;
                    if (aTok === bTok) return 1;
                    if (bTok.startsWith(aTok) || aTok.startsWith(bTok)) return 0.92; // will ~ william
                    // fallback to levenshtein score
                    return similarityScore(aTok, bTok);
                }

                function nameMatchScore(inputName, candidateName) {
                    const a = tokenizeName(inputName).map(expandNick);
                    const b = tokenizeName(candidateName).map(expandNick);
                    if (a.length === 0 || b.length === 0) return 0;

                    // last token is treated as last name (works for most cases)
                    const aLast = a[a.length - 1];
                    const bLast = b[b.length - 1];

                    const lastScore = tokenSimilarity(aLast, bLast);

                    // If last names are not close, don’t suggest at all
                    if (lastScore < 0.85) return 0;

                    // best first-name score among remaining tokens
                    const aFirst = a[0];
                    const bFirst = b[0];
                    const firstScore = tokenSimilarity(aFirst, bFirst);

                    // Weight last name heavily so shared first names don’t cause chaos
                    return 0.65 * lastScore + 0.35 * firstScore;
                }

                function normalizeName(s) {
                    return (s || "")
                        .trim()
                        .toLowerCase()
                        .replace(/\s+/g, " ")
                        .replace(/[’']/g, "'");
                }

                function levenshtein(a, b) {
                    a = a || "";
                    b = b || "";
                    const m = a.length,
                        n = b.length;
                    if (m === 0) return n;
                    if (n === 0) return m;

                    const dp = Array.from({ length: m + 1 }, () =>
                        new Array(n + 1).fill(0)
                    );
                    for (let i = 0; i <= m; i++) dp[i][0] = i;
                    for (let j = 0; j <= n; j++) dp[0][j] = j;

                    for (let i = 1; i <= m; i++) {
                        for (let j = 1; j <= n; j++) {
                        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                        dp[i][j] = Math.min(
                            dp[i - 1][j] + 1,
                            dp[i][j - 1] + 1,
                            dp[i - 1][j - 1] + cost
                        );
                        }
                    }
                    return dp[m][n];
                }

                function similarityScore(a, b) {
                    const A = normalizeName(a);
                    const B = normalizeName(b);
                    if (!A || !B) return 0;
                    const dist = levenshtein(A, B);
                    return 1 - dist / Math.max(A.length, B.length);
                }

                function findBestMatch(inputName, players) {
                    const x = normalizeName(inputName);
                    if (!x) return null;

                    // exact match (case/space-insensitive)
                    const exact = players.find(p => normalizeName(p) === x);
                    if (exact) return { type: "exact", name: exact, score: 1 };

                    // score everyone using token-aware scoring
                    const scored = players
                        .map(p => ({ name: p, score: nameMatchScore(inputName, p) }))
                        .sort((a, b) => b.score - a.score);

                    const best = scored[0];
                    const second = scored[1];

                    if (!best) return null;

                    // “sensitivity”:
                    // lower this to suggest more often, but keep the ambiguity guard below
                    const SUGGEST_THRESHOLD = 0.80;

                    // Ambiguity guard: only suggest if best is clearly better than second-best
                    const MIN_GAP = 0.06; // increase if you want fewer suggestions when names collide

                    if (best.score >= SUGGEST_THRESHOLD) {
                        if (!second || (best.score - second.score) >= MIN_GAP) {
                        return { type: "fuzzy", name: best.name, score: best.score };
                        }
                        // too ambiguous: don't auto-suggest a single person
                        return { type: "ambiguous", options: scored.slice(0, 5) };
                    }

                    return null;
                }


                function setHint(el, text, kind) {
                    if (!el) return;
                    el.textContent = text || "";
                    el.classList.remove("warn", "ok");
                    if (kind) el.classList.add(kind);
                }

                function validateOrConfirmPlayer(inputEl, hintEl) {
                    const typed = (inputEl.value || "").trim();
                    if (!typed) return false;

                    const players = window.playersCache || [];
                    if (players.length === 0) {
                        // Don’t block user if list failed to load
                        setHint(hintEl, "", null);
                        return true;
                    }

                    const best = findBestMatch(typed, players);

                    if (best && best.type === "exact") {
                        setHint(hintEl, "Recognized player.", "ok");
                        return true;
                    }

                    // tweak this threshold if it nags too often
                    const SUGGEST_THRESHOLD = 0.82;

                    if (best && best.type === "fuzzy") {
                        setHint(hintEl, `Did you mean "${best.name}"?`, "warn");

                        const useSuggestion = confirm(
                        `Player "${typed}" is not an exact match.\n\nDid you mean "${best.name}"?\n\nOK = use "${best.name}"\nCancel = keep "${typed}"`
                        );

                        if (useSuggestion) {
                        inputEl.value = best.name;
                        setHint(hintEl, "Updated to existing player.", "ok");
                        return true;
                        }

                        const createNew = confirm(
                        `"${typed}" isn’t in the player list.\n\nCreate new player "${typed}"?`
                        );
                        if (!createNew) return false;

                        setHint(hintEl, "New player will be created.", "warn");
                        return true;
                    }

                    if (best && best.type === "ambiguous") {
                        // Don’t annoy user with a wrong suggestion; show top options and then ask "create?"
                        const choices = best.options.map(o => `- ${o.name}`).join("\n");
                        const proceed = confirm(
                            `That name is close to multiple existing players:\n\n${choices}\n\nOK = keep "${typed}" (create new)\nCancel = go back and edit`
                        );
                        if (!proceed) return false;
                        setHint(hintEl, "New player will be created.", "warn");
                        return true;
                    }

                    setHint(hintEl, `"${typed}" not found in existing players.`, "warn");

                    const create = confirm(
                        `"${typed}" isn’t in the player list.\n\nCreate new player "${typed}"?`
                    );
                    if (!create) return false;

                    setHint(hintEl, "New player will be created.", "warn");
                    return true;
                }

                // Run checks when leaving fields
                p1Input.addEventListener("blur", () =>
                validateOrConfirmPlayer(p1Input, p1Hint)
                );
                p2Input.addEventListener("blur", () =>
                validateOrConfirmPlayer(p2Input, p2Hint)
                );

                // --- One-shot submit + redirect ---
                let submitting = false;

                formEl.addEventListener("submit", async (e) => {
                e.preventDefault();
                if (submitting) return;

                // Prevent p1 == p2 (case/space-insensitive)
                if (
                    normalizeName(p1Input.value) &&
                    normalizeName(p1Input.value) === normalizeName(p2Input.value)
                ) {
                    alert("Player 1 and Player 2 cannot be the same person.");
                    return;
                }

                // Confirm/validate both players before submitting
                const ok1 = validateOrConfirmPlayer(p1Input, p1Hint);
                if (!ok1) return;

                const ok2 = validateOrConfirmPlayer(p2Input, p2Hint);
                if (!ok2) return;

                submitting = true;
                btn.disabled = true;
                const oldText = btn.textContent;
                btn.textContent = "Submitting...";

                // Set idempotency token
                requestIdInput.value = crypto.randomUUID
                    ? crypto.randomUUID()
                    : `${Date.now()}-${Math.random()}`;

                try {
                    const resp = await fetch(formEl.action, {
                    method: "POST",
                    body: new FormData(formEl),
                    });

                    const text = await resp.text();
                    let result;
                    try {
                    result = JSON.parse(text);
                    } catch {
                    throw new Error(
                        "Server did not return JSON. Response was: " + text.slice(0, 120)
                    );
                    }

                    if (!result.success) throw new Error(result.error || "Unknown error");

                    const base = location.pathname.includes("/Slaps-Online/")
                    ? "/Slaps-Online"
                    : "";
                    window.location.href = `${base}/submitted.html?matchId=${encodeURIComponent(
                    result.matchId
                    )}`;
                } catch (err) {
                    alert("Submission failed: " + err.message);
                    submitting = false;
                    btn.disabled = false;
                    btn.textContent = oldText;
                }
                });

                // Initialize winner options on load
                updateWinnerOptions();
            });
            </script>


    </body>
